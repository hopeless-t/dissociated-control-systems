[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dissociated-control-systems"
version = "0.0.1"
description = "Reproducible research primitives for partially observed and dissociated control states."
requires-python = ">=3.12"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
