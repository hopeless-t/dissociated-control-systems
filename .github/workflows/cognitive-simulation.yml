name: cognitive-graceful-degradation-simulation

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_decline.py"
      - "tests/test_cognitive_decline.py"
      - "docs/CGD-SIM-001.md"
      - ".github/workflows/cognitive-simulation.yml"
  pull_request:
    paths:
      - "src/dissociated_control_systems/cognitive_decline.py"
      - "tests/test_cognitive_decline.py"
      - "docs/CGD-SIM-001.md"
      - ".github/workflows/cognitive-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Validate known-answer simulation
        run: pytest -q tests/test_cognitive_decline.py
      - name: Run frozen four-arm simulation
        run: |
          python -m dissociated_control_systems.cognitive_decline --format markdown > cognitive-summary.md
          cat cognitive-summary.md
          cat cognitive-summary.md >> "$GITHUB_STEP_SUMMARY"
