name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_context_watchdog_common_mode.py"
      - "tests/test_cognitive_context_watchdog_common_mode.py"
      - "docs/CGD-SIM-052.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

# This lane intentionally validates only the current research frontier.
# Full historical regression remains owned by ci.yml (`pytest` on every push/PR).
# Keeping the two roles separate prevents the "fast" loop from growing linearly
# with every completed simulation.
jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Current frontier validation
        run: pytest -q tests/test_cognitive_context_watchdog_common_mode.py
      - name: Run current frontier report
        run: |
          python -m dissociated_control_systems.cognitive_context_watchdog_common_mode > cognitive-frontier.md
          cat cognitive-frontier.md
          cat cognitive-frontier.md >> "$GITHUB_STEP_SUMMARY"
