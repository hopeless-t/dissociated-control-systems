name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_probe_transaction.py"
      - "tests/test_cognitive_probe_transaction.py"
      - "docs/CGD-SIM-030.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Probe-transaction validation
        run: pytest -q tests/test_cognitive_probe_transaction.py
      - name: Run probe transaction fault injection
        run: |
          python -m dissociated_control_systems.cognitive_probe_transaction > cognitive-probe-transaction.md
          cat cognitive-probe-transaction.md
          cat cognitive-probe-transaction.md >> "$GITHUB_STEP_SUMMARY"
