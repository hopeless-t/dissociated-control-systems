name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_factorized_recovery.py"
      - "tests/test_cognitive_factorized_recovery.py"
      - "docs/CGD-SIM-021.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Factorized recovery smoke
        run: pytest -q tests/test_cognitive_factorized_recovery.py
      - name: Run factorized partial-state recovery
        run: |
          python -m dissociated_control_systems.cognitive_factorized_recovery > cognitive-factorized-recovery.md
          cat cognitive-factorized-recovery.md
          cat cognitive-factorized-recovery.md >> "$GITHUB_STEP_SUMMARY"
