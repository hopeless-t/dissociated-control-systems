name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_rare_capture_null.py"
      - "tests/test_cognitive_rare_capture_null.py"
      - "docs/CGD-SIM-033.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Rare-capture-null smoke
        run: pytest -q tests/test_cognitive_rare_capture_null.py
      - name: Run exact random-capture null
        run: |
          python -m dissociated_control_systems.cognitive_rare_capture_null > cognitive-rare-capture-null.md
          cat cognitive-rare-capture-null.md
          cat cognitive-rare-capture-null.md >> "$GITHUB_STEP_SUMMARY"
