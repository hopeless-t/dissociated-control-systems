name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_partition_ceiling.py"
      - "tests/test_cognitive_partition_ceiling.py"
      - "docs/CGD-SIM-035.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Partition-ceiling validation
        run: pytest -q tests/test_cognitive_partition_ceiling.py
      - name: Run oracle fault-partition ceiling
        run: |
          python -m dissociated_control_systems.cognitive_partition_ceiling > cognitive-partition-ceiling.md
          cat cognitive-partition-ceiling.md
          cat cognitive-partition-ceiling.md >> "$GITHUB_STEP_SUMMARY"
