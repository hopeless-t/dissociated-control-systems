name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_active_diagnosis.py"
      - "src/dissociated_control_systems/cognitive_convergence.py"
      - "src/dissociated_control_systems/cognitive_ceiling_audit.py"
      - "src/dissociated_control_systems/cognitive_ensemble_frontier.py"
      - "src/dissociated_control_systems/cognitive_disagreement_resolver.py"
      - "tests/test_cognitive_ensemble_frontier.py"
      - "tests/test_cognitive_disagreement_resolver.py"
      - "docs/CGD-SIM-009.md"
      - "docs/CGD-SIM-010.md"
      - "docs/CGD-SIM-011.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Fast frontier validation
        run: |
          pytest -q tests/test_cognitive_disagreement_resolver.py
      - name: Run disagreement resolver
        run: |
          python -m dissociated_control_systems.cognitive_disagreement_resolver > cognitive-disagreement.md
          cat cognitive-disagreement.md
          cat cognitive-disagreement.md >> "$GITHUB_STEP_SUMMARY"
