name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_longitudinal_freshness.py"
      - "tests/test_cognitive_longitudinal_freshness.py"
      - "docs/CGD-SIM-041.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Longitudinal-freshness validation
        run: pytest -q tests/test_cognitive_longitudinal_freshness.py
      - name: Run longitudinal observation freshness
        run: |
          python -m dissociated_control_systems.cognitive_longitudinal_freshness > cognitive-longitudinal-freshness.md
          cat cognitive-longitudinal-freshness.md
          cat cognitive-longitudinal-freshness.md >> "$GITHUB_STEP_SUMMARY"
