name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_rare_capture.py"
      - "tests/test_cognitive_rare_capture.py"
      - "docs/CGD-SIM-032.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Rare-capture smoke
        run: pytest -q tests/test_cognitive_rare_capture.py
      - name: Run causal rare-state capture
        run: |
          python -m dissociated_control_systems.cognitive_rare_capture > cognitive-rare-capture.md
          cat cognitive-rare-capture.md
          cat cognitive-rare-capture.md >> "$GITHUB_STEP_SUMMARY"
