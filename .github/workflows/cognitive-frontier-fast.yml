name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_harness_repair.py"
      - "src/dissociated_control_systems/cognitive_temporal_frontier.py"
      - "tests/test_cognitive_temporal_frontier.py"
      - "docs/CGD-SIM-012.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Fast frontier validation
        run: pytest -q tests/test_cognitive_temporal_frontier.py
      - name: Run temporal evidence frontier
        run: |
          python -m dissociated_control_systems.cognitive_temporal_frontier > cognitive-temporal-frontier.md
          cat cognitive-temporal-frontier.md
          cat cognitive-temporal-frontier.md >> "$GITHUB_STEP_SUMMARY"
