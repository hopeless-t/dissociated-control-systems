name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_observational_protocol.py"
      - "tests/test_cognitive_observational_protocol.py"
      - "docs/CGD-OBS-002.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Observational protocol tests
        run: pytest -q tests/test_cognitive_observational_protocol.py
      - name: Render frozen observational math
        run: |
          python -m dissociated_control_systems.cognitive_observational_protocol > cognitive-observational-protocol.md
          cat cognitive-observational-protocol.md
          cat cognitive-observational-protocol.md >> "$GITHUB_STEP_SUMMARY"
