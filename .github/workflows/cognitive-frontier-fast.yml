name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_external_intake.py"
      - "tests/test_cognitive_external_intake.py"
      - "docs/CGD-OBS-001.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: External source-intake tests
        run: pytest -q tests/test_cognitive_external_intake.py
      - name: Run observational source intake
        run: |
          python -m dissociated_control_systems.cognitive_external_intake > cognitive-external-intake.md
          cat cognitive-external-intake.md
          cat cognitive-external-intake.md >> "$GITHUB_STEP_SUMMARY"
