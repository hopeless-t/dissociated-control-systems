name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_adaptive_reanchor.py"
      - "tests/test_cognitive_adaptive_reanchor.py"
      - "docs/CGD-SIM-046.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Adaptive re-anchor validation
        run: pytest -q tests/test_cognitive_adaptive_reanchor.py
      - name: Run selective adaptive re-anchor
        run: |
          python -m dissociated_control_systems.cognitive_adaptive_reanchor > cognitive-adaptive-reanchor.md
          cat cognitive-adaptive-reanchor.md
          cat cognitive-adaptive-reanchor.md >> "$GITHUB_STEP_SUMMARY"
