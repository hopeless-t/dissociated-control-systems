name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_authority_frontier.py"
      - "tests/test_cognitive_authority_frontier.py"
      - "docs/CGD-SIM-034.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Authority-frontier validation
        run: pytest -q tests/test_cognitive_authority_frontier.py
      - name: Run enrichment-authority frontier
        run: |
          python -m dissociated_control_systems.cognitive_authority_frontier > cognitive-authority-frontier.md
          cat cognitive-authority-frontier.md
          cat cognitive-authority-frontier.md >> "$GITHUB_STEP_SUMMARY"
