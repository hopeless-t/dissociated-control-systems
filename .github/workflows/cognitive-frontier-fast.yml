name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_sequential_shift.py"
      - "tests/test_cognitive_sequential_shift.py"
      - "docs/CGD-SIM-017.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Sequential-shift smoke
        run: pytest -q tests/test_cognitive_sequential_shift.py
      - name: Run sequential weak-shift detector
        run: |
          python -m dissociated_control_systems.cognitive_sequential_shift > cognitive-sequential-shift.md
          cat cognitive-sequential-shift.md
          cat cognitive-sequential-shift.md >> "$GITHUB_STEP_SUMMARY"
