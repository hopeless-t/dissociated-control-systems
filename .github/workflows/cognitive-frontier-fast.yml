name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_context_bound_reanchor.py"
      - "tests/test_cognitive_context_bound_reanchor.py"
      - "docs/CGD-SIM-048.md"
      - "src/dissociated_control_systems/cognitive_context_authority_gate.py"
      - "tests/test_cognitive_context_authority_gate.py"
      - "docs/CGD-SIM-049.md"
      - "src/dissociated_control_systems/cognitive_context_authority_freshness.py"
      - "tests/test_cognitive_context_authority_freshness.py"
      - "docs/CGD-SIM-050.md"
      - "src/dissociated_control_systems/cognitive_context_authority_watchdog.py"
      - "tests/test_cognitive_context_authority_watchdog.py"
      - "docs/CGD-SIM-051.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Context-bound scheduler validation
        run: pytest -q tests/test_cognitive_context_bound_reanchor.py
      - name: Run context-bound adaptive re-anchor
        run: |
          python -m dissociated_control_systems.cognitive_context_bound_reanchor > cognitive-context-bound-reanchor.md
          cat cognitive-context-bound-reanchor.md
          cat cognitive-context-bound-reanchor.md >> "$GITHUB_STEP_SUMMARY"
      - name: Context reliability authority-gate validation
        run: pytest -q tests/test_cognitive_context_authority_gate.py
      - name: Run context reliability authority gate
        run: |
          python -m dissociated_control_systems.cognitive_context_authority_gate > cognitive-context-authority-gate.md
          cat cognitive-context-authority-gate.md
          cat cognitive-context-authority-gate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Context authority freshness validation
        run: pytest -q tests/test_cognitive_context_authority_freshness.py
      - name: Run context authority freshness lease
        run: |
          python -m dissociated_control_systems.cognitive_context_authority_freshness > cognitive-context-authority-freshness.md
          cat cognitive-context-authority-freshness.md
          cat cognitive-context-authority-freshness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Context authority watchdog validation
        run: pytest -q tests/test_cognitive_context_authority_watchdog.py
      - name: Run context authority freshness watchdog
        run: |
          python -m dissociated_control_systems.cognitive_context_authority_watchdog > cognitive-context-authority-watchdog.md
          cat cognitive-context-authority-watchdog.md
          cat cognitive-context-authority-watchdog.md >> "$GITHUB_STEP_SUMMARY"
