name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_disagreement_trigger.py"
      - "tests/test_cognitive_disagreement_trigger.py"
      - "docs/CGD-SIM-044.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Disagreement-trigger validation
        run: pytest -q tests/test_cognitive_disagreement_trigger.py
      - name: Run disagreement-trigger informativeness audit
        run: |
          python -m dissociated_control_systems.cognitive_disagreement_trigger > cognitive-disagreement-trigger.md
          cat cognitive-disagreement-trigger.md
          cat cognitive-disagreement-trigger.md >> "$GITHUB_STEP_SUMMARY"
