name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_residual_cusum.py"
      - "tests/test_cognitive_residual_cusum.py"
      - "docs/CGD-SIM-018.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Residual-CUSUM smoke
        run: pytest -q tests/test_cognitive_residual_cusum.py
      - name: Run template-residual CUSUM
        run: |
          python -m dissociated_control_systems.cognitive_residual_cusum > cognitive-residual-cusum.md
          cat cognitive-residual-cusum.md
          cat cognitive-residual-cusum.md >> "$GITHUB_STEP_SUMMARY"
