name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_ood_challenge.py"
      - "src/dissociated_control_systems/cognitive_ood_routing.py"
      - "tests/test_cognitive_ood_challenge.py"
      - "tests/test_cognitive_ood_routing.py"
      - "docs/CGD-SIM-014.md"
      - "docs/CGD-SIM-015.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: OOD routing smoke
        run: pytest -q tests/test_cognitive_ood_routing.py
      - name: Run OOD authority routing
        run: |
          python -m dissociated_control_systems.cognitive_ood_routing > cognitive-ood-routing.md
          cat cognitive-ood-routing.md
          cat cognitive-ood-routing.md >> "$GITHUB_STEP_SUMMARY"
