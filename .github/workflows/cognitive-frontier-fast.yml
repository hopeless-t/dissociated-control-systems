name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_practice_effect_frontier.py"
      - "tests/test_cognitive_practice_effect_frontier.py"
      - "docs/CGD-SIM-043.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Practice-effect frontier validation
        run: pytest -q tests/test_cognitive_practice_effect_frontier.py
      - name: Run repeated-test practice-effect frontier
        run: |
          python -m dissociated_control_systems.cognitive_practice_effect_frontier > cognitive-practice-effect-frontier.md
          cat cognitive-practice-effect-frontier.md
          cat cognitive-practice-effect-frontier.md >> "$GITHUB_STEP_SUMMARY"
