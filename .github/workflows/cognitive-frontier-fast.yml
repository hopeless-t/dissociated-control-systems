name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_environment_confounding.py"
      - "tests/test_cognitive_environment_confounding.py"
      - "docs/CGD-SIM-047.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Environment-confounding validation
        run: pytest -q tests/test_cognitive_environment_confounding.py
      - name: Run environment-confounded sentinel audit
        run: |
          python -m dissociated_control_systems.cognitive_environment_confounding > cognitive-environment-confounding.md
          cat cognitive-environment-confounding.md
          cat cognitive-environment-confounding.md >> "$GITHUB_STEP_SUMMARY"
