name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_external_evidence.py"
      - "tests/test_cognitive_external_evidence.py"
      - "docs/CGD-SIM-033.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: External-evidence qualification tests
        run: pytest -q tests/test_cognitive_external_evidence.py
      - name: Run external observation-lane audit
        run: |
          python -m dissociated_control_systems.cognitive_external_evidence > cognitive-external-evidence.md
          cat cognitive-external-evidence.md
          cat cognitive-external-evidence.md >> "$GITHUB_STEP_SUMMARY"
