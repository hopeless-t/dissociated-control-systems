name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_external_observation_contract.py"
      - "src/dissociated_control_systems/cognitive_external_identifiability.py"
      - "tests/test_cognitive_external_observation_contract.py"
      - "tests/test_cognitive_external_identifiability.py"
      - "docs/CGD-EXT-001.md"
      - "docs/CGD-EXTERNAL-VARIABLE-MAP.md"
      - "docs/CGD-SIM-038.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: External observation contract validation
        run: pytest -q tests/test_cognitive_external_observation_contract.py
      - name: External identifiability validation
        run: pytest -q tests/test_cognitive_external_identifiability.py
      - name: Run external observation admission audit
        run: |
          python -m dissociated_control_systems.cognitive_external_observation_contract > cognitive-external-observation-contract.md
          cat cognitive-external-observation-contract.md
          cat cognitive-external-observation-contract.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run structural identifiability audit
        run: |
          python -m dissociated_control_systems.cognitive_external_identifiability > cognitive-external-identifiability.md
          cat cognitive-external-identifiability.md
          cat cognitive-external-identifiability.md >> "$GITHUB_STEP_SUMMARY"
