name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_functional_sentinel.py"
      - "tests/test_cognitive_functional_sentinel.py"
      - "docs/CGD-SIM-045.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Functional-sentinel validation
        run: pytest -q tests/test_cognitive_functional_sentinel.py
      - name: Run independent functional-sentinel frontier
        run: |
          python -m dissociated_control_systems.cognitive_functional_sentinel > cognitive-functional-sentinel.md
          cat cognitive-functional-sentinel.md
          cat cognitive-functional-sentinel.md >> "$GITHUB_STEP_SUMMARY"
