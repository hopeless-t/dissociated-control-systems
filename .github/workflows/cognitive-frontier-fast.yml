name: cognitive-frontier-fast

on:
  push:
    branches:
      - research/cognitive-graceful-degradation-sim
    paths:
      - "src/dissociated_control_systems/cognitive_restoration.py"
      - "tests/test_cognitive_restoration.py"
      - "docs/CGD-SIM-019.md"
      - ".github/workflows/cognitive-frontier-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install -e ".[dev]"
      - name: Restoration smoke
        run: pytest -q tests/test_cognitive_restoration.py
      - name: Run quarantine/recalibration/restoration experiment
        run: |
          python -m dissociated_control_systems.cognitive_restoration > cognitive-restoration.md
          cat cognitive-restoration.md
          cat cognitive-restoration.md >> "$GITHUB_STEP_SUMMARY"
